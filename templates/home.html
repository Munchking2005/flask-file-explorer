<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Flask Path Explorer</title>
</head>
<body>
	<h1>Flask Path Explorer</h1>
	<h2>Path information</h2>
	<p><strong>Current working directory:</strong>
		{{current_directory}}
	</p>
	<p><strong>Script location:</strong>
		{{script_location}}
	</p>
	<p><strong>Project directory:</strong>
		{{project_directory}}
	</p>
	<p><strong>Relative file path</strong>
		{{relative_file}}
	</p>
	<p><strong>Resolved file path</strong>
		{{absolute_file}}
	</p>
</body>
</html>
